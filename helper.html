<!DOCTYPE html>
<html class="dark" lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/css.css">

        <title>Document</title>
    </head>
    <body>
        <div id="top-bar">
            <div class="input-con">
                <span class="keybind">A</span>
                <select name="" id="discipline-select">
                    <option value="" selected disabled>Sportart auswählen</option>
                    <option value="800m-run">800m Lauf</option>
                    <option value="100m-sprint">100m Sprint</option>
                    <option value="three-jump">Dreiersprung</option>
                    <option value="200g-throw">200g Weitwurf</option>
                </select>
            </div>
            <div class="input-con">
                <span class="keybind">K</span>
                <select name="" id="class-select">
                    <option value="" selected disabled>Klasse auswählen</option>
                    <optgroup label="Klasse 5">
                        <option value="5a">5a</option>
                        <option value="5b">5b</option>
                        <option value="5c">5c</option>
                        <option value="5d">5d</option>
                    </optgroup>
                    <optgroup label="Klasse 6">
                        <option value="6a">6a</option>
                        <option value="6b">6b</option>
                        <option value="6c">6c</option>
                        <option value="6d">6d</option>
                    </optgroup>
                    <optgroup label="Klasse 7">
                        <option value="7a">7a</option>
                        <option value="7b">7b</option>
                        <option value="7c">7c</option>
                        <option value="7d">7d</option>
                    </optgroup>
                </select>
            </div>
            <div class="time-display">
                <span>10:00:00</span>
            </div>
            <div id="sync-state-con">
                <span class="material-icons-round offline" id="sync-icon">cloud_off</span>
                <span id="open-upload-state">6 Versuche <span class="material-icons-round">upload</span></span>
                <span id="last-time-state">vor 10min</span>
                <button class="material-icons-round">sync</button>
            </div>
            <div id="settings-con">
                <button class="material-icons-round" popovertarget="settings-dialog" popovertargetaction="show">settings</button>
            </div>
        </div>
        <div id="data-input-con">
            <table>
                <thead class="data-header">
                    <tr>
                        <th>ID</th>
                        <th>Vorname</th>
                        <th>Nachname</th>
                        <th>Versuch 1 (MM:SS)</th>
                        <th>Versuch 2 (m)</th>
                        <th><button><span class="material-icons-round">timer</span> Timer</button></th>
                    </tr>
                </thead>
                <tbody class="data-body">
                    <tr class="data-row">
                        <td>1</td>
                        <td>Max</td>
                        <td>Mustermann</td>
                        <td><input type="text" inputmode="decimal" data-unit="minutes"></td>
                        <td><input type="text" inputmode="decimal" data-unit="meters"></td>
                        <td><button class="stop-timer"><span class="material-icons-round">stop</span></button><button class="individual-timer"><span class="material-icons-round">timer</span></button></td>
                    </tr>
                    <tr class="data-row">
                        <td>1</td>
                        <td>Max</td>
                        <td>Mustermann</td>
                        <td><input type="text" inputmode="decimal" data-unit="minutes"></td>
                        <td><input type="text" inputmode="decimal" data-unit="meters"></td>
                    </tr>
                    <tr class="data-row">
                        <td>1</td>
                        <td>Max</td>
                        <td>Mustermann</td>
                        <td><input type="text" inputmode="decimal" data-unit="minutes"></td>
                        <td><input type="text" inputmode="decimal" data-unit="meters"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <dialog popover id="settings-dialog">
            <div class="modal-surface">
                <h1>Einstellungen</h1>
                <div class="modal-content">
                    <div class="input-con">
                        <label for="dark-mode-toggle"><span class="material-icons-round">dark_mode</span> Dunkelmodus</label>
                        <input type="checkbox" id="dark-mode-toggle">
                    </div>
                    <div class="input-con">
                        <label for="auto-sync-toggle"><span class="material-icons-round">sync</span> Automatischer Upload</label>
                        <input type="checkbox" id="auto-sync-toggle">
                    </div>
                    <div class="input-con">
                        <label for="helper-name-input"><span class="material-icons-round">person</span> Name des Helfers</label>
                        <input type="text" id="helper-name-input" placeholder="Name eingeben">
                        <button id="save-helper-name-btn"><span class="material-icons-round">save</span></button>
                    </div>
                    <div class="input-con">
                        <button id="delete-database-btn"><span class="material-icons-round">delete</span> Datenbank löschen</button>
                    </div>
                    <div class="input-con">
                        <label for="server-hostname-input"><span class="material-icons-round">dns</span> Server Hostname</label>
                        <input type="text" id="server-hostname-input" placeholder="Hostname eingeben">
                        <button id="save-server-hostname-btn"><span class="material-icons-round">save</span></button>
                    </div>
                </div>
                <div class="modal-action-con">
                    <button id="close-settings-btn" popovertarget="settings-dialog" popovertargetaction="hide">Schließen</button>
                </div>
            </div>
        </dialog>
        <script type="module" src="js/helper.js"></script>
    </body>
</html>
